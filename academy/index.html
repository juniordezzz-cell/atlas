<div class="app app--full">

  <!-- ============ MAIN (sem sidebar) ============ -->
  <main class="main">
    <header class="topbar">
      <a class="ac-back" href="../pages/dashboard.html" title="Voltar ao ATLAS">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>

    <div id="view"></div>

<!-- ===== Camada de dados do Academy =====
     Os includes abaixo levam ?v= (versão do Academy). Motivo: o dev
     server (python http.server) responde 304 por falso-positivo de
     timestamp e o navegador serve JS velho — o clássico "a correção
     não pega". URL versionada é a única forma à prova de 304. Suba o
     número ao mudar estes arquivos. -->
<script src="../core/http.js?v=academy-12"></script>
<script src="../core/providers/registry.js?v=academy-12"></script>
<script src="../core/providers/feargreed.js?v=academy-12"></script>
<script src="../core/providers/coingecko.js?v=academy-12"></script>
<script src="../core/providers/coinpaprika.js?v=academy-12"></script>

<script src="../core/providers/coinlore.js?v=academy-12"></script>
