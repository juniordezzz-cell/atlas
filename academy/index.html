<!DOCTYPE html>
<html lang="pt-BR" data-module="academy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS — Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;550;600;650;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="css/academy.css">

  <!-- ===== ATLAS · camada global (Fase 0) ===================================
       Identidade visual, tema, idioma e moeda centralizados.
       O CSS entra por ÚLTIMO de propósito: ele governa os tokens.
       ============================================================ -->
  <link rel="stylesheet" href="../themes/atlas-theme.css">
  <link rel="stylesheet" href="../themes/atlas-effects.css">
  <script src="../core/settings.js"></script>
  <script src="../core/i18n.js"></script>
  <script src="../core/currency.js"></script>
  <script src="../core/atlas-boot.js"></script>
  <link rel="stylesheet" href="../core/ui/atlas-shell.css">
  <!-- Seletor de carteira: componente compartilhado (um CSS para todo o ATLAS) -->
  <link rel="stylesheet" href="../wallets/walletSelector.css">
  <script src="../core/ui/atlas-shell.js" defer></script>
</head>
<body>
<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>
        </svg>
      </span>
      <span class="logo-text">ACADEMY</span>
    </div>

    <nav class="nav" id="nav"></nav>

    <a class="nav-back" href="../dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Voltar ao ATLAS</span>
    </a>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <div class="greet">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub">Central de conhecimento — todas as teses do ATLAS.</p>
      </div>
      <div class="topbar-right">
        <div class="searchbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-3.5-3.5"/></svg>
          <input type="text" id="globalSearch" placeholder="Pesquisar teses…" />
        </div>
      </div>
    </header>

    <div id="view"></div>
  </main>
</div>

<div id="toasts"></div>

<script src="../wallets/walletStore.js"></script>
<script src="../wallets/walletTypes.js"></script>
<script src="../wallets/walletLedger.js"></script>
<script src="../wallets/walletManager.js"></script>
<script src="../wallets/walletMenus.js"></script>
<script src="../wallets/walletDialog.js"></script>
<script src="../wallets/walletSelector.js"></script>

<script src="../core/atlas-price.js"></script>

<script src="../core/entities/theses.js"></script>
<script src="js/academy.js"></script>
</body>
</html>
