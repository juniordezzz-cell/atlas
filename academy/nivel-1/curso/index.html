<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Atlas Academy: criptoeconomia com aulas por nível, laboratórios, diagramas e fontes."><title>Atlas Academy — Trilha de criptoeconomia</title>
<!-- Mora dentro de academy/nivel-1/index.html (iframe), que dá o menu e a
     marca do ATLAS. O iframe isola o CSS do curso (Tailwind com preflight)
     do CSS do site. A trava de login vale aqui também, para quem abrir o
     endereço direto. -->
<script src="../../../core/atlas-auth.js"></script>
<script src="../../../core/atlas-secure.js"></script>
<link rel="stylesheet" href="assets/css/utilities.css"><link rel="stylesheet" href="assets/css/legacy.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/atlas-embed.css">
<script defer src="assets/vendor/chart.umd.js"></script><script defer src="assets/vendor/lucide.js"></script><script defer src="assets/js/course.js"></script><script defer src="assets/js/modules.js"></script><script defer src="assets/js/main.js"></script><script defer src="assets/js/academy.js"></script>
</head><body>
<a class="skip-link" href="#main">Ir para o conteúdo</a>
<main id="main" tabindex="-1">
<header id="sidebar" class="course-bar" aria-label="Navegação do curso">
 <div class="course-picker">
  <span class="course-level">Nível 1 ›</span>
  <button id="menu-toggle" class="course-current" aria-expanded="false" aria-controls="course-navigation" aria-label="Abrir lista de módulos"><span id="course-current-label">Visão geral</span> <span aria-hidden="true">▾</span></button>
  <nav id="course-navigation" class="course-menu" aria-label="Trilha de estudos"><div id="module-navigation"></div><div class="course-menu-foot"><span id="sidebar-progress">0 de 10 módulos concluídos</span><progress id="sidebar-meter" value="0" max="10" aria-label="Módulos concluídos"></progress></div></nav>
 </div>
 <div class="course-links"><button onclick="app.navigate('glossary')">📖 Glossário</button><button onclick="app.navigate('sources')">↗ Fontes</button><button onclick="app.navigate('saved')">☆ Notas</button></div>
 <form id="search-form" role="search"><label class="sr-only" for="course-search">Buscar na trilha</label><input id="course-search" type="search" placeholder="Buscar no curso…" autocomplete="off"><button type="submit" aria-label="Buscar">⌕</button></form>
</header>
<div id="view-container" class="relative p-5 md:p-10 max-w-7xl mx-auto pb-28"></div><noscript><p>Ative JavaScript para acessar as aulas e os laboratórios.</p></noscript></main><div id="announcement" class="sr-only" aria-live="polite"></div>
</body></html>
