<!DOCTYPE html>
<html lang="pt-BR" data-module="atlas">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Painel consolidado do ATLAS: patrimonio, evolucao, distribuicao e alertas dos modulos Hold, Trade, DeFi e RWA.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>ATLAS — Dashboard</title>
  <!-- Inter para texto E título, JetBrains Mono para números. A mesma
       string de URL em todas as páginas de propósito: assim o navegador
       reaproveita UMA entrada de cache no site inteiro, e pedir eixos
       diferentes faria o Google servir instâncias com métricas
       ligeiramente distintas. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">

  <!-- ===== ATLAS · camada global (Fase 0) ===================================
       Identidade visual, tema, idioma e moeda centralizados.
       O CSS entra por ÚLTIMO de propósito: ele governa os tokens.
       ============================================================ -->
  <link rel="stylesheet" href="themes/atlas-theme.css">
  <link rel="stylesheet" href="themes/atlas-effects.css">
  <link rel="stylesheet" href="themes/atlas-print.css" media="print">

  <!-- Oráculo compartilhado (mesmo componente dos módulos) -->
  <link rel="stylesheet" href="core/ui/atlas-shell.css">
  <link rel="stylesheet" href="core/ui/atlas-onboarding.css">
  <!-- Seletor de carteira: componente compartilhado (um CSS para todo o ATLAS) -->
  <link rel="stylesheet" href="wallets/walletSelector.css">

  <!-- PRIMEIRO de todos: migra as chaves antigas do localStorage
       para a convencao unica, antes de qualquer store abrir. -->
  <script src="core/atlas-storage.js"></script>
  <script src="core/settings.js"></script>
  <script src="core/i18n.js"></script>
  <script src="core/currency.js"></script>
  <script src="core/atlas-boot.js"></script>
  <script src="core/ui/atlas-chart-theme.js"></script>
</head>
<body>
<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="9"/><path d="M12 3a13 13 0 0 0 0 18M12 3a13 13 0 0 1 0 18M3 12h18"/>
        </svg>
      </span>
      <span class="logo-text">ATLAS</span>
    </div>

    <!-- Os itens do menu sao gerados por js/atlas-nav.js a partir de
         UMA lista, em vez de estarem escritos por extenso aqui, em
         relatorios.html e em configuracoes.html. data-atlas-nav diz
         qual item marcar como atual. -->
    <nav class="nav" data-atlas-nav="dashboard"></nav>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">

    <!-- Topbar -->
    <header class="topbar">
      <div class="greet">
        <!-- preenchido por js/dashboard.js com a saudação da hora e o
             nome do gestor configurado -->
        <h1 id="saudacao">Bem-vindo</h1>
        <p>Bem-vindo ao ATLAS</p>
      </div>
      <div class="topbar-right">
        <!-- Seletor de carteira: markup e CSS são do componente
             compartilhado (wallets/walletSelector.*). Aqui fica só o
             host vazio — sem classe de módulo, para não haver nada
             que possa sobrescrever a aparência dele. -->
        <div id="walletSel"></div>
        <button class="icon-btn" title="Aplicativos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="5" cy="5" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="19" cy="5" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/><circle cx="5" cy="19" r="1.6"/><circle cx="12" cy="19" r="1.6"/><circle cx="19" cy="19" r="1.6"/></svg>
        </button>
        <button class="icon-btn" title="Notificações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="dot"></span>
        </button>
        <!-- iniciais preenchidas por js/atlas-topbar.js a partir do
             nome do gestor (Configuracoes > Hold) -->
        <div class="avatar" aria-hidden="true"></div>
      </div>
    </header>

    <!-- KPIs -->
    <section class="kpis" id="kpis"></section>

    <!-- Gráficos -->
    <section class="charts">
      <div class="card chart-evolucao">
        <div class="card-head">
          <h3>Evolução Patrimonial</h3>
          <button class="select">Últimos 30 dias
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>
        <div class="evo-value">
          <strong id="evoTotal" data-atlas-flash="patrimonio">US$ 0</strong>
          <span class="pos" id="evoVar">0,00% no período</span>
        </div>
        <div class="chart-box"><canvas id="chartEvolucao"></canvas></div>
      </div>

      <div class="card chart-donut">
        <div class="card-head"><h3>Distribuição por Categoria</h3></div>
        <div class="donut-wrap">
          <div class="donut-box"><canvas id="chartCategoria"></canvas></div>
          <ul class="legend" id="legendCategoria"></ul>
        </div>
      </div>

      <div class="card chart-donut">
        <div class="card-head"><h3>Distribuição por Blockchain</h3></div>
        <div class="donut-wrap">
          <div class="donut-box"><canvas id="chartBlockchain"></canvas></div>
          <ul class="legend" id="legendBlockchain"></ul>
        </div>
      </div>
    </section>

    <!-- Linha inferior -->
    <section class="bottom">
      <div class="card">
        <div class="card-head"><h3>Últimas Movimentações</h3></div>
        <ul class="mov-list" id="movList"></ul>
      </div>

      <div class="card">
        <div class="card-head"><h3>Pools Ativas</h3></div>
        <ul class="pool-list" id="poolList"></ul>
        <!-- Era um <button> sem nenhum listener. Como o destino é uma
             página, o elemento certo é uma âncora: ganha o clique, o
             meio-clique para nova aba e o foco por teclado de graça. -->
        <a class="card-btn" href="defi/pools.html">Ver todas as pools</a>
      </div>

      <div class="card">
        <div class="card-head"><h3>Alertas Inteligentes</h3></div>
        <!-- Sem botão de "ver todos" de propósito: desde que os alertas
             passaram a vir dos QUATRO módulos (AtlasConsolidation.alerts),
             não existe UMA página que os reúna — apontar para o motor de
             risco do RWA mandaria o usuário para o lugar errado na maior
             parte dos casos. A lista já mostra os mais graves primeiro.
             Uma central de alertas de verdade é etapa própria do roadmap. -->
        <ul class="alert-list" id="alertList"></ul>
      </div>
    </section>
  </main>
</div>

<!-- ============ ORÁCULO ============
     O Oráculo agora é o componente compartilhado (core/ui/atlas-shell.js):
     mesmo ícone (avatar) do Oráculo e mesmo painel de todos os módulos. O markup é
     injetado por JS; aqui só registramos o cérebro do Dashboard (js/oraculo.js). -->

<!-- Chart.js — MESMA origem e MESMA versão de defi/ e RWA/ (jsDelivr).
     Antes esta página usava cdnjs e as outras jsDelivr: o mesmo arquivo
     baixado duas vezes, dois DNS, dois handshakes e dois pontos de
     falha externos. Ao trocar de módulo o navegador já tem em cache. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<!-- ===== Camadas de dados dos módulos (consolidação real em US$) ===== -->
<script src="wallets/walletStore.js"></script>
<script src="wallets/walletTypes.js"></script>
<script src="wallets/walletLedger.js"></script>
<script src="wallets/walletManager.js"></script>
<script src="wallets/walletMenus.js"></script>
<script src="wallets/walletDialog.js"></script>
<script src="wallets/walletSelector.js"></script>
<script src="core/atlas-price.js"></script>
<script src="RWA/js/store.js"></script>
<script src="defi/js/data.js"></script>
<script src="hold/data/seed.js"></script>
<script src="hold/js/state.js"></script>
<script src="trade/assets/js/core/util.js"></script>
<script src="trade/assets/js/core/store.js"></script>
<script src="trade/assets/js/core/seed.js"></script>
<script src="trade/assets/js/core/state.js"></script>

<!-- Livro-razão central e entidade de Teses: são as duas fontes que
     alimentam os cards "Últimas Movimentações" e "Alertas Inteligentes"
     com os QUATRO módulos, e não só com o RWA como antes. Precisam vir
     depois das camadas de dados acima (os adaptadores as consultam) e
     antes de js/data.js, que monta o ATLAS_DATA. -->
<script src="core/entities/theses.js"></script>
<script src="js/atlas-movements.js"></script>
<script src="js/atlas-consolidation.js"></script>

<!-- ===== Dashboard ===== -->
<script src="js/data.js"></script>
<script src="js/dashboard.js"></script>

<!-- ===== Shell da raiz: navegação móvel + menus da barra superior =====
     atlas-topbar.js entra DEPOIS de js/dashboard.js de propósito: ele lê
     ATLAS_DATA.alertas para montar o menu de notificações. -->
<script src="js/atlas-nav.js"></script>
<script src="js/atlas-topbar.js"></script>

<!-- ===== Oráculo compartilhado + cérebro do Dashboard ===== -->
<script src="core/ui/atlas-flash.js"></script>
<script src="core/ui/atlas-icons.js"></script>
<script src="core/ui/atlas-ui.js"></script>
<script src="core/atlas-notifications.js"></script>
<script src="core/ui/atlas-shell.js"></script>
<script src="js/oraculo.js"></script>

<!-- ===== Primeiros passos (só na primeira sessão) =====
     Entra por ÚLTIMO de propósito: precisa de AtlasSettings (moeda),
     AtlasWallets (carteira), AtlasUI (foco preso e toast) e do
     Dashboard já pintado, para poder repintar quando o usuário
     responde. maybeStart() não faz nada da segunda vez em diante. -->
<script src="core/ui/atlas-onboarding.js"></script>
<script>
  (function () {
    function abrir() { if (window.AtlasOnboarding) AtlasOnboarding.maybeStart(); }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", abrir);
    } else { abrir(); }
  })();
</script>
</body>
</html>
