<!DOCTYPE html>
<html lang="pt-BR" data-module="atlas" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Relatórios — Finanças ATLAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/atlas-tokens.css">
  <link rel="stylesheet" href="css/financas.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#05080F">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>
<body data-page="relatorios">
  <div class="fx-app" data-fx-app>
    <main class="fx-main" data-fx-main>
      <section class="fx-content">
        <div class="fx-page">

          <div class="fx-page-toolbar">
            <div class="fx-segmented" aria-label="Tipo de relatório">
              <button class="is-active" type="button" data-report-view="mensal">Mensal</button>
              <button type="button" data-report-view="trimestral">Trimestral</button>
              <button type="button" data-report-view="anual">Anual</button>
            </div>
            <div class="fx-page-toolbar-actions">
              <button id="exportPdf" class="fx-btn" type="button">Exportar PDF</button>
              <button id="exportExcel" class="fx-btn fx-btn--primary" type="button">Exportar Excel</button>
            </div>
          </div>

          <article class="card">
            <div class="fx-chart-head">
              <h2 class="fx-section-title">Comparativo</h2>
            </div>
            <div class="fx-canvas-wrap">
              <canvas id="relatoriosComparativoChart" aria-label="Gráfico comparativo de receitas e despesas"></canvas>
            </div>
          </article>

          <section class="card fx-table-card">
            <div class="fx-table-toolbar">
              <h2 class="fx-section-title">Tabela comparativa</h2>
              <span class="fx-tag fx-tag--neutral">Receitas x despesas</span>
            </div>
            <div class="fx-table-scroll">
              <table class="fx-table">
                <thead><tr><th>Período</th><th>Receitas</th><th>Despesas</th><th>Saldo</th><th>Status</th></tr></thead>
                <tbody id="relatoriosTableBody"></tbody>
              </table>
            </div>
          </section>

        </div>
      </section>
    </main>
  </div>
  <script src="js/ui/shell.js"></script>
  <script type="module" src="js/app-bridge.js"></script>
  <script src="js/pages/relatorios.js"></script>
  <script>window.Shell.mount({ page: "relatorios", title: "Relatórios", subtitle: "Exportáveis e resumos" });</script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
