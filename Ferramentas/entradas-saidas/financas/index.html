<!DOCTYPE html>
<html lang="pt-BR" data-module="tools" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ATLASfinances</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/atlas-tokens.css">
  <link rel="stylesheet" href="css/boot.css">
  <link rel="stylesheet" href="css/financas.css">
  <link rel="stylesheet" href="css/painel.css?v=1">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#03060C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ATLASfinances">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <!-- Trava de login do ATLAS: sem sessão autorizada, vai para pages/login.html. -->
  <script src="../../../core/atlas-auth.js"></script>
  <script src="../../../core/atlas-secure.js"></script>
  <link rel="stylesheet" href="../../../core/ui/atlas-shell.css">
</head>
<body data-page="dashboard">

  <!-- ============ BOOT / BOAS-VINDAS ============
       Splash de abertura do app (eco do boot do site). Só aqui, na tela
       de abertura; js/boot.js roda a barra e revela o app, uma vez por
       sessão. -->
  <div class="boot" id="fxBoot" role="status" aria-label="Carregando ATLASfinances">
    <div class="boot__sky" aria-hidden="true">
      <span class="boot__glow"></span>
      <span class="boot__stars"></span>
    </div>
    <div class="boot__stage">
      <img class="boot__hero" src="assets/boot-hero.png" alt="ATLASfinances" width="320" height="307">
      <h1 class="boot__brand">ATLAS<span>finances</span></h1>
      <p class="boot__status" id="fxBootStatus">Ligando sistema…</p>
      <div class="boot__progress">
        <div class="boot__track"><div class="boot__bar" id="fxBootBar"></div></div>
        <span class="boot__pct" id="fxBootPct">0%</span>
      </div>
    </div>
  </div>
  <script src="js/boot.js"></script>

  <div class="fx-app" data-fx-app>
    <main class="fx-main" data-fx-main>
      <section class="fx-content">
        <!-- Painel de 23/10/2026: tudo é montado por js/telas/painel.js.
             Design: ../docs/superpowers/specs/2026-10-23-financas-objetiva-design.md -->
        <div class="fp-pagina" id="painel">
          <div data-conteudo></div>
          <div class="fp-barra-oraculo" data-barra>
            <div data-chat-lista aria-live="polite"></div>
            <form class="fp-barra-form" data-chat-form autocomplete="off">
              <img class="fp-avatar" src="../../../assets/atena.webp" alt="Oráculo">
              <input type="text" enterkeyhint="send" maxlength="500" aria-label="Fale com o Oráculo"
                placeholder="O que você quer anotar hoje?">
              <button class="fp-enviar" type="submit">Lançar</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/ui/shell.js?v=2"></script>
  <script>window.Shell.mount({ page: "dashboard", title: "Finanças", subtitle: "Ganhos e despesas" });</script>
  <script src="js/ui/fundo-fluxo.js?v=1"></script>
  <script type="module" src="js/telas/painel.js?v=1"></script>
  <script src="js/pwa.js" defer></script>
  <script src="../../../core/ui/atlas-shell.js"></script>
</body>
</html>
