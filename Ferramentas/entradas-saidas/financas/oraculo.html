<!DOCTYPE html>
<html lang="pt-BR" data-module="tools" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Oráculo · ATLASfinances</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/atlas-tokens.css">
  <link rel="stylesheet" href="css/financas.css">
  <link rel="stylesheet" href="css/painel.css?v=1">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#03060C">
  <!-- Trava de login do ATLAS: sem sessão autorizada, vai para pages/login.html. -->
  <script src="../../../core/atlas-auth.js"></script>
  <script src="../../../core/atlas-secure.js"></script>
  <link rel="stylesheet" href="../../../core/ui/atlas-shell.css">
</head>
<body data-page="oraculo">
  <div class="fx-app" data-fx-app>
    <main class="fx-main" data-fx-main>
      <section class="fx-content">
        <div class="fp-pagina fp-oraculo" id="oraculo">
          <div class="fp-palco">
            <div class="fp-palco-av"><img src="../../../assets/atena.webp" alt="Oráculo"></div>
            <h2>Conte seus ganhos e despesas</h2>
            <p>Do jeito que você falaria. Eu anoto com a data de hoje, separo por categoria e faço as contas. Se não entender, eu pergunto.</p>
            <div class="fp-sugs" data-exemplos style="justify-content:center"></div>
            <div data-importar style="margin-top:16px"></div>
          </div>
          <div class="fp-conversa" data-chat-lista aria-live="polite"></div>
          <form class="fp-barra-form" data-chat-form autocomplete="off">
            <img class="fp-avatar" src="../../../assets/atena.webp" alt="">
            <textarea rows="1" enterkeyhint="send" maxlength="20000" aria-label="Fale com o Oráculo"
              placeholder="O que você quer anotar hoje? (pode colar o extrato do banco)"></textarea>
            <button class="fp-enviar" type="submit">Enviar</button>
          </form>
        </div>
      </section>
    </main>
  </div>
  <script src="js/ui/shell.js?v=2"></script>
  <script>window.Shell.mount({ page: "oraculo", title: "Oráculo", subtitle: "Lance falando, sem formulário" });</script>
  <script src="js/ui/fundo-fluxo.js?v=1"></script>
  <script type="module" src="js/telas/oraculo.js?v=1"></script>
  <script src="js/pwa.js" defer></script>
  <script src="../../../core/ui/atlas-shell.js"></script>
</body>
</html>
