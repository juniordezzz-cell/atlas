<!DOCTYPE html>
<html lang="pt-BR" data-module="tools">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Calculadora de Market Cap do ATLAS: o preço da unidade não diz se um token é barato. Veja o valor de mercado, quanto ainda vai ser desbloqueado e o tamanho que um preço sonhado exige.">
<title>Calculadora de Market Cap — ATLAS</title>
<link rel="icon" type="image/png" href="../../assets/iconeatlas.png">
<link rel="stylesheet" href="../../themes/atlas-fonts.css">
<link rel="stylesheet" href="../../core/ui/atlas-shell.css">
<link rel="stylesheet" href="estilo.css?v=mcap-6">
<!-- Trava de login do ATLAS: sem sessão autorizada, vai para pages/login.html. -->
<script src="../../core/atlas-auth.js"></script>
<script src="../../core/atlas-secure.js"></script>
<!-- Cenário de fundo do ATLAS (piloto 15/10/2026, Paper Shaders).
     Registro: docs/visual-ferramentas-2026-10-15.md -->
<link rel="stylesheet" href="../../core/ui/atlas-cenario.css?v=5">
<script type="module" src="../../core/ui/atlas-cenario.js?v=3"></script>
</head>
<body>
<div class="wrap">

  <header class="top">
    <a class="voltar" href="../../pages/ferramentas.html">← Ferramentas</a>
    <h1>Calculadora de <span>Market Cap</span></h1>
    <p class="sub">Barato ou caro é o tamanho da pizza, não o preço da fatia.</p>
    <p class="estudo">Simulação para estudo. Não é recomendação de investimento e não usa os dados da sua carteira.</p>
  </header>

  <!-- Dois modos: um token só (a tela original) ou a batalha de 2 a 4. -->
  <div class="modos" role="tablist" aria-label="Modo">
    <button type="button" role="tab" data-modo="um" aria-selected="true">Um token</button>
    <button type="button" role="tab" data-modo="batalha" aria-selected="false">Batalha</button>
  </div>

  <div id="modo-um">
  <section class="busca" aria-label="Escolher token">
    <label for="mc-busca">Escolha um token</label>
    <div class="busca__campo">
      <input id="mc-busca" type="search" autocomplete="off" spellcheck="false"
             placeholder="Ex.: JUP, Solana, AAVE"
             role="combobox" aria-expanded="false" aria-controls="mc-sugestoes" aria-autocomplete="list">
      <ul id="mc-sugestoes" class="sugestoes" role="listbox" hidden></ul>
    </div>
    <p id="mc-aviso" class="aviso" role="status" hidden></p>
  </section>

  <section id="mc-ficha" class="ficha" aria-live="polite" hidden></section>

  <section id="mc-calc" class="calc" hidden>
    <div class="abas" role="tablist" aria-label="Modo da calculadora">
      <button type="button" role="tab" data-aba="preco" aria-selected="true">Preço sonhado</button>
      <button type="button" role="tab" data-aba="dinheiro" aria-selected="false">Simular investimento</button>
    </div>
    <div id="mc-painel" class="painel" role="tabpanel"></div>
  </section>

  <section id="mc-explica" class="explica" aria-label="Como ler estes números"></section>
  </div>

  <!-- ===== Batalha: de 2 a 4 tokens no mesmo alvo (batalha.js) ===== -->
  <div id="modo-batalha" hidden>
    <section class="busca" aria-label="Escolher tokens da batalha">
      <label for="bt-busca">Escolha de 2 a 4 tokens</label>
      <div class="busca__campo">
        <input id="bt-busca" type="search" autocomplete="off" spellcheck="false"
               placeholder="Ex.: JUP, ONDO, MET"
               role="combobox" aria-expanded="false" aria-controls="bt-sugestoes" aria-autocomplete="list">
        <ul id="bt-sugestoes" class="sugestoes" role="listbox" hidden></ul>
      </div>
      <div id="bt-fichas" class="bt-fichas" aria-live="polite"></div>
      <p id="bt-aviso" class="aviso" role="status" hidden></p>
    </section>

    <section class="bt-alvo">
      <div class="campo">
        <label for="bt-alvo">Todos chegam a (US$)</label>
        <input id="bt-alvo" type="text" inputmode="decimal" autocomplete="off" value="1">
        <p class="dica">Para mudar o alvo de um token só, use o ✎ na coluna dele.</p>
      </div>
    </section>

    <section id="bt-resultado" class="bt-resultado" aria-live="polite"></section>
    <section id="bt-dicionario" class="explica" aria-label="Dicionário"></section>
  </div>

</div>

<script src="../../core/http.js"></script>
<script src="../../core/providers/registry.js"></script>
<script src="../../core/providers/coingecko.js"></script>
<script src="../../core/providers/coinpaprika.js"></script>
<script src="calculo.js?v=mcap-6"></script>
<script src="app.js?v=mcap-6"></script>
<script src="batalha.js?v=mcap-6"></script>
<script src="../../core/ui/atlas-shell.js"></script>
</body>
</html>
