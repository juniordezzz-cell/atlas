<!DOCTYPE html>
<html lang="pt-BR" data-module="atlas">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesse o ATLAS — seu sistema operacional financeiro.">
  <link rel="icon" type="image/png" href="../assets/iconeatlas.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#05080F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ATLAS">
  <title>ATLAS — Login</title>
  <!-- Inter e JetBrains Mono servidas pelo proprio ATLAS.
       Vinham do fonts.googleapis.com em vinte paginas, num sistema que
       se declara sem dependencias e promete abrir sem internet.
       Ver themes/atlas-fonts.css. -->
  <link rel="stylesheet" href="../themes/atlas-fonts.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">

  <!-- ===== ATLAS · camada global (Fase 0) ===================================
       Identidade visual, tema, idioma e moeda centralizados.
       O CSS entra por ÚLTIMO de propósito: ele governa os tokens.
       ============================================================ -->
  <link rel="stylesheet" href="../themes/atlas-theme.css">
  <link rel="stylesheet" href="../themes/atlas-effects.css">
  <link rel="stylesheet" href="../themes/atlas-print.css" media="print">
  <!-- PRIMEIRO de todos: migra as chaves antigas do localStorage
       para a convencao unica, antes de qualquer store abrir. -->
  <script src="../core/atlas-storage.js"></script>
  <script src="../core/settings.js"></script>
  <script src="../core/i18n.js"></script>
  <script src="../core/currency.js"></script>
  <script src="../core/atlas-boot.js"></script>
  <script src="../core/atlas-auth.js"></script>
  <script src="../core/atlas-pwa.js"></script>
</head>
<body class="login-body">
  <div class="login-card">
    <h2 class="login-title">Entrar na sua conta</h2>

    <form id="loginForm" novalidate>
      <label class="field">
        <span>Email</span>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
      </label>

      <label class="field">
        <span>Senha</span>
        <input type="password" id="senha" placeholder="••••••••••" autocomplete="current-password">
      </label>

      <!-- "Esqueceu sua senha?" apontava para href="#". Enquanto o
           login é simulado (qualquer submit entra) e não há
           autenticação real, não existe senha a recuperar: o link
           prometia um fluxo inexistente. Volta junto com o item 4.1. -->

      <button type="submit" class="btn-entrar">Entrar</button>

      <!-- O "Cadastre-se" apontava para href="#": um link que promete
           uma tela e não leva a lugar nenhum. Enquanto não há
           autenticação real (item 4.1), ele aponta para a página que
           explica o produto — que é o que alguém sem conta procura. -->
      <p class="signup">Primeira vez por aqui? <a href="landing.html">Conheça o ATLAS</a></p>
    </form>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
