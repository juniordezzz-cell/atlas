<!DOCTYPE html>
<html lang="pt-BR" data-module="defi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Historico do ATLAS DeFi: posicoes encerradas, motivo do encerramento e resultado realizado.">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#05080F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ATLAS">
  <title>Histórico · ATLAS DeFi</title>
  <!-- Inter e JetBrains Mono servidas pelo proprio ATLAS.
       Vinham do fonts.googleapis.com em vinte paginas, num sistema que
       se declara sem dependencias e promete abrir sem internet.
       Ver themes/atlas-fonts.css. -->
  <link rel="stylesheet" href="../themes/atlas-fonts.css">
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <!-- ===== ATLAS · camada global (Fase 0) ===================================
       Identidade visual, tema, idioma e moeda centralizados.
       O CSS entra por ÚLTIMO de propósito: ele governa os tokens.
       ============================================================ -->
  <link rel="stylesheet" href="../themes/atlas-theme.css">
  <link rel="stylesheet" href="../themes/atlas-effects.css">
  <link rel="stylesheet" href="../themes/atlas-print.css" media="print">
  <!-- PRIMEIRO de todos: migra as chaves antigas do localStorage
       para a convencao unica, antes de qualquer store abrir. -->
  <script src="../core/atlas-storage.js"></script>
  <script src="../core/atlas-snapshots.js"></script>
  <script src="../core/atlas-contabilidade.js"></script>
  <script src="../core/atlas-supervisor.js"></script>
  <script src="../core/settings.js"></script>
  <script src="../core/i18n.js"></script>
  <script src="../core/currency.js"></script>
  <script src="../core/atlas-boot.js"></script>
  <script src="../core/atlas-auth.js"></script>
  <script src="../core/atlas-pwa.js"></script>
  <link rel="stylesheet" href="../core/ui/atlas-shell.css">
  <link rel="stylesheet" href="../core/ui/atlas-palette.css">
  <!-- Seletor de carteira: componente compartilhado (um CSS para todo o ATLAS) -->
  <link rel="stylesheet" href="../wallets/walletSelector.css">
  <script src="../core/ui/atlas-flash.js"></script>
  <script src="../core/ui/atlas-icons.js"></script>
  <script src="../core/ui/atlas-ui.js"></script>
  <script src="../js/atlas-consolidation.js" defer></script>
  <script src="../core/atlas-notifications.js" defer></script>
  <script src="../core/atlas-export.js" defer></script>
  <script src="../core/ui/atlas-palette.js" defer></script>
  <script src="../core/atlas-vocabulario.js"></script>
<script src="../core/ui/atlas-shell.js" defer></script>
  <script src="../core/atlas-backup.js" defer></script>
</head>
<body>
  <div id="nav"></div>
  <main class="app">
    <div class="wrap page page-enter">
      <div class="page-head">
        <div>
          <div class="eyebrow">Arquivo</div>
          <h1 class="page-title">Histórico</h1>
          <p class="page-sub">Posições encerradas. Consulte qualquer operação antiga.</p>
        </div>
      </div>

      <div class="fin-grid" id="histKpis" style="grid-template-columns:repeat(3,1fr)"></div>

      <div class="filterbar" style="margin-top:26px">
        <div class="searchbar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-3.5-3.5"/></svg>
          <input type="text" id="hSearch" placeholder="Buscar por token…" />
        </div>
        <div class="filter-select"><select class="select" id="hChain"><option value="">Blockchain</option></select></div>
        <div class="filter-select"><select class="select" id="hProto"><option value="">Protocolo</option></select></div>
        <div class="filter-select"><select class="select" id="hCat"><option value="">Categoria</option></select></div>
        <div class="filter-select"><select class="select" id="hResult">
          <option value="">Resultado</option>
          <option value="gain">Lucro</option>
          <option value="loss">Prejuízo</option>
        </select></div>
      </div>

      <div id="histList"></div>
    </div>
  </main>
  <div id="toasts"></div>
  <script src="../wallets/walletStore.js"></script>
  <script src="../wallets/walletTypes.js"></script>
  <script src="../wallets/walletLedger.js"></script>
  <script src="../wallets/walletCaixa.js"></script>
  <script src="../wallets/walletManager.js"></script>
  <script src="../wallets/walletMenus.js"></script>
  <script src="../wallets/walletDialog.js"></script>
  <script src="../wallets/walletSelector.js"></script>
  <script src="../core/atlas-price.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/search.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
