<!DOCTYPE html>
<html lang="pt-BR" data-module="defi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Analytics do ATLAS DeFi: evolucao patrimonial, evolucao dos lucros e APR realizado por posicao.">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <title>Analytics · ATLAS DeFi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;550;600;650;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <!-- ===== ATLAS · camada global (Fase 0) ===================================
       Identidade visual, tema, idioma e moeda centralizados.
       O CSS entra por ÚLTIMO de propósito: ele governa os tokens.
       ============================================================ -->
  <link rel="stylesheet" href="../themes/atlas-theme.css">
  <link rel="stylesheet" href="../themes/atlas-effects.css">
  <script src="../core/settings.js"></script>
  <script src="../core/i18n.js"></script>
  <script src="../core/currency.js"></script>
  <script src="../core/atlas-boot.js"></script>
  <link rel="stylesheet" href="../core/ui/atlas-shell.css">
  <!-- Seletor de carteira: componente compartilhado (um CSS para todo o ATLAS) -->
  <link rel="stylesheet" href="../wallets/walletSelector.css">
  <script src="../core/ui/atlas-shell.js" defer></script>
</head>
<body>
  <div id="nav"></div>
  <main class="app">
    <div class="wrap page page-enter">
      <div class="page-head">
        <div>
          <div class="eyebrow">Análises</div>
          <h1 class="page-title">Analytics</h1>
          <p class="page-sub">Apenas leitura — nenhum dado é editado aqui, só apresentado.</p>
        </div>
      </div>

      <!-- Evolução patrimonial + lucros -->
      <div class="col-2">
        <div class="panel panel-pad">
          <div class="panel-head"><div><div class="eyebrow">Patrimônio</div><h3>Evolução Patrimonial</h3></div></div>
          <div class="chart-box h-md"><canvas id="aEvo"></canvas></div>
        </div>
        <div class="panel panel-pad">
          <div class="panel-head"><div><div class="eyebrow">Resultado</div><h3>Evolução dos Lucros</h3></div></div>
          <div class="chart-box h-md"><canvas id="aProfit"></canvas></div>
        </div>
      </div>

      <!-- APR realizado -->
      <div class="section">
        <div class="panel panel-pad">
          <div class="panel-head"><div><div class="eyebrow">Rendimento</div><h3>APR Realizado por Posição</h3></div></div>
          <div class="chart-box h-md"><canvas id="aApr"></canvas></div>
        </div>
      </div>

      <!-- Distribuições -->
      <div class="section">
        <div class="section-head"><h2>Distribuições</h2>
          <div class="segmented" id="aDistToggle">
            <button data-d="protocol" class="active">Protocolo</button>
            <button data-d="chain">Blockchain</button>
            <button data-d="token">Token</button>
            <button data-d="category">Categoria</button>
          </div>
        </div>
        <div class="col-2">
          <div class="panel panel-pad">
            <div class="donut-wrap">
              <div class="chart-box" style="height:200px"><canvas id="aDonut"></canvas>
                <div class="donut-center"><div class="dc-v" id="dcVal">—</div><div class="dc-k">total</div></div>
              </div>
              <div class="legend" id="aLegend"></div>
            </div>
          </div>
          <div class="panel panel-pad">
            <div class="panel-head"><h3 id="aBarTitle">Por protocolo</h3></div>
            <div class="dist-list" id="aBars"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="toasts"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="../wallets/walletStore.js"></script>
  <script src="../wallets/walletTypes.js"></script>
  <script src="../wallets/walletLedger.js"></script>
  <script src="../wallets/walletManager.js"></script>
  <script src="../wallets/walletMenus.js"></script>
  <script src="../wallets/walletDialog.js"></script>
  <script src="../wallets/walletSelector.js"></script>
  <script src="../core/atlas-price.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
