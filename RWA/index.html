<!DOCTYPE html>
<html lang="pt-BR" data-module="rwa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Modulo RWA do ATLAS — inteligencia macro, portfolio de ativos do mundo real, motor de risco e narrativas.">
  <link rel="icon" type="image/png" href="../assets/iconeatlas.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#05080F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ATLAS">
  <title>ATLAS · RWA — Macro Intelligence</title>
  <!-- Inter e JetBrains Mono servidas pelo proprio ATLAS.
       Vinham do fonts.googleapis.com em vinte paginas, num sistema que
       se declara sem dependencias e promete abrir sem internet.
       Ver themes/atlas-fonts.css. -->
  <link rel="stylesheet" href="../themes/atlas-fonts.css">
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <!-- ===== ATLAS · camada global (Fase 0) ===================================
       Identidade visual, tema, idioma e moeda centralizados.
       O CSS entra por ÚLTIMO de propósito: ele governa os tokens.
       ============================================================ -->
  <link rel="stylesheet" href="../themes/atlas-theme.css">
  <link rel="stylesheet" href="../themes/atlas-effects.css">
  <link rel="stylesheet" href="../themes/atlas-print.css" media="print">
  <!-- PRIMEIRO de todos: migra as chaves antigas do localStorage
       para a convencao unica, antes de qualquer store abrir. -->
  <script src="../core/atlas-storage.js"></script>
  <script src="../core/atlas-snapshots.js"></script>
  <script src="../core/atlas-contabilidade.js"></script>
  <script src="../core/atlas-supervisor.js"></script>
  <script src="../core/settings.js"></script>
  <script src="../core/i18n.js"></script>
  <script src="../core/currency.js"></script>
  <script src="../core/atlas-boot.js"></script>
  <script src="../core/atlas-auth.js"></script>
  <script src="../core/atlas-pwa.js"></script>
  <script src="../core/ui/atlas-chart-theme.js"></script>
  <link rel="stylesheet" href="../core/ui/atlas-shell.css">
  <link rel="stylesheet" href="../core/ui/atlas-palette.css">
  <!-- Seletor de carteira: componente compartilhado (um CSS para todo o ATLAS) -->
  <link rel="stylesheet" href="../wallets/walletSelector.css">
  <script src="../core/ui/atlas-flash.js"></script>
  <script src="../core/ui/atlas-icons.js"></script>
  <script src="../core/ui/atlas-ui.js"></script>
  <script src="../js/atlas-consolidation.js" defer></script>
  <script src="../core/atlas-notifications.js" defer></script>
  <script src="../core/atlas-export.js" defer></script>
  <script src="../core/ui/atlas-palette.js" defer></script>
  <script src="../core/atlas-vocabulario.js"></script>
<script src="../core/ui/atlas-shell.js" defer></script>
  <script src="../core/atlas-backup.js" defer></script>
</head>
<body>
  <div class="app-shell" id="shell"></div>
  <div id="toasts"></div>

  <!-- Chart.js, servido pelo próprio ATLAS. Carrega async e redesenha
       ao chegar: o RWA monta as views antes do gráfico existir, e o
       onload é o que faz o canvas ser preenchido depois.

       Vinha do jsdelivr. Assíncrono e com onerror vazio, a falha era
       invisível: sem internet o módulo abria inteiro e simplesmente
       não desenhava gráfico nenhum, sem uma linha explicando. -->
  <script>
    (function(){
      var s=document.createElement("script");
      s.src="../assets/vendor/chart-4.4.1.min.js";
      s.async=true;
      s.onload=function(){if(window.Router&&Router.resolve)Router.resolve();};
      s.onerror=function(){};
      document.head.appendChild(s);
    })();
  </script>

  <!-- Registro central de carteiras (opcional — fallback interno se falhar) -->
  <script src="../wallets/walletStore.js"></script>
  <script src="../wallets/walletTypes.js"></script>
  <script src="../wallets/walletLedger.js"></script>
  <script src="../wallets/walletCaixa.js"></script>
  <script src="../wallets/walletManager.js"></script>
  <script src="../wallets/walletMenus.js"></script>
  <script src="../wallets/walletDialog.js"></script>
  <script src="../wallets/walletSelector.js"></script>
  <script src="../js/atlas-movements.js" onerror="void 0"></script>
  <!-- Autocomplete de ativos CoinGecko (opcional) -->
  <!-- Core ATLAS: http + provedores de dados (opcionais — fallback interno) -->
  <script src="../core/http.js" onerror="void 0"></script>
  <script src="../core/providers/registry.js" onerror="void 0"></script>
  <script src="../core/providers/coingecko.js" onerror="void 0"></script>
  <script src="../core/atlas-price.js" onerror="void 0"></script>
  <!-- Cadeia unica de preco do ATLAS: API primeiro, fonte secundaria
       (DEX) depois, e preco informado pelo usuario quando nenhuma
       reconhece o ativo. Ver core/atlas-precos.js. -->
  <script src="../core/providers/geckoterminal.js" onerror="void 0"></script>
  <script src="../core/atlas-precos.js"></script>
  <script src="../core/atlas-tokens.js"></script>
  <script src="../js/atlas-assets.js" onerror="void 0"></script>

  <!-- Entidade compartilhada de Teses: o RWA era o único módulo que não
       a consumia, e por isso não aparecia no Academy. -->
  <script src="../core/entities/theses.js"></script>

  <!-- Núcleo do módulo -->
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/charts.js"></script>
  <script src="components/ui.js"></script>

  <!-- App unificado (shell + rotas + views) -->
  <script src="js/rwa-app.js"></script>
</body>
</html>
