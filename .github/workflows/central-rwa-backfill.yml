name: Central RWA · backfill (manual)

# Baixa 10 anos de histórico diário. É retomável: se parar no meio, rode de novo.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Limitar a estes tickers (ex.: NVDA,GOLD). Vazio = camada A + camada B."
        required: false
        default: ""
      migrate:
        description: "Aplicar as migrations antes (primeira vez)"
        type: boolean
        default: false

concurrency:
  group: central-rwa-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: central-rwa/backend
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
      TIINGO_KEY: ${{ secrets.TIINGO_KEY }}
      TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      FRED_KEY: ${{ secrets.FRED_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: central-rwa/backend/pyproject.toml
      - run: pip install -e .
      - name: Checar segredo
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Configure o segredo SUPABASE_DB_URL antes do backfill."
            exit 1
          fi
      - name: Migrations
        if: inputs.migrate
        run: python -m central_rwa migrate
      - name: Backfill
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python -m central_rwa backfill --only "$ONLY"
          else
            python -m central_rwa backfill
          fi
      - run: python -m central_rwa report
