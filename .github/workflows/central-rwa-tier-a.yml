name: Central RWA · camada A (6h)

on:
  schedule:
    - cron: "0 3,9,15,21 * * *"   # 00h, 06h, 12h, 18h de Brasília (UTC-3)
  workflow_dispatch:

# Todos os jobs que gravam no banco compartilham o mesmo grupo: nunca rodam juntos
# (o estado de cota do roteador é lido no início e gravado no fim).
concurrency:
  group: central-rwa-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tier-a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: central-rwa/backend
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      TIINGO_KEY: ${{ secrets.TIINGO_KEY }}
      FRED_KEY: ${{ secrets.FRED_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: central-rwa/backend/pyproject.toml
      - run: pip install -e .
      - name: Rodar camada A
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL não configurada — job pulado (configure o segredo para ativar)."
            exit 0
          fi
          python -m central_rwa tier_a
