name: Oraculo operations
on:
  push:
    paths: ['core/atlas-oraculo-operacoes*', 'core/ui/atlas-shell.js', 'defi/js/data.js', 'defi/js/pool-history*', 'wallets/**', '.github/workflows/oraculo-operacoes.yml']
  pull_request:
    paths: ['core/atlas-oraculo-operacoes*', 'core/ui/atlas-shell.js', 'defi/js/data.js', 'defi/js/pool-history*', 'wallets/**', '.github/workflows/oraculo-operacoes.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test core/atlas-oraculo-operacoes.test.cjs defi/js/pool-history.test.cjs
