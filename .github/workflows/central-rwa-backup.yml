name: Central RWA · backup antes da retirada

# Uso único (11/11/2026). Salva o schema central_rwa do Supabase como artefato
# do GitHub (90 dias) ANTES de a migração 20261111000001_remover_central_rwa.sql
# chegar à main e apagar os dados. Roda no push do branch da retirada, para o
# backup existir antes do merge. Sai do repositório no último commit do branch.
on:
  push:
    branches: [remover-central-rwa]
    paths: ['.github/workflows/central-rwa-backup.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Cliente Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Exportar central_rwa
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::SUPABASE_DB_URL ausente"; exit 1; fi
          export PATH=/usr/lib/postgresql/17/bin:$PATH
          mkdir -p backup/csv
          psql "$SUPABASE_DB_URL" -Atc "select version()" | tee backup/servidor.txt
          # Contagem de linhas por tabela: é o que se confere antes do merge.
          psql "$SUPABASE_DB_URL" -At -F ';' -c "
            select c.relname, (xpath('/row/n/text()', query_to_xml(format('select count(*) as n from central_rwa.%I', c.relname), false, true, '')))[1]::text
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'central_rwa' and c.relkind = 'r' order by 1" | tee backup/contagem.txt
          # CSV por tabela: legível sem Postgres.
          for t in $(cut -d';' -f1 backup/contagem.txt); do
            psql "$SUPABASE_DB_URL" -c "\copy (select * from central_rwa.\"$t\") to 'backup/csv/$t.csv' csv header"
          done
          # Dump completo (estrutura + dados). Pode falhar pelo pooler de transação; o CSV já basta.
          pg_dump "$SUPABASE_DB_URL" --schema=central_rwa --no-owner --no-privileges -Fc -f backup/central_rwa.dump \
            || echo "::warning::pg_dump falhou; ficam os CSVs e a contagem."
          ls -la backup backup/csv
      - uses: actions/upload-artifact@v4
        with:
          name: central-rwa-backup-20261111
          path: backup/
          retention-days: 90
          if-no-files-found: error
