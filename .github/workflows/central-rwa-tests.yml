name: Central RWA · testes

on:
  push:
    paths: ["central-rwa/**", ".github/workflows/central-rwa-*.yml"]
  pull_request:
    paths: ["central-rwa/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: central-rwa/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: central-rwa/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  # Deploy automático: com os testes verdes num push na main, aplica as
  # migrations e roda eventos + agentes. Assim ninguém precisa disparar o
  # backfill à mão depois de cada mudança no backend.
  deploy:
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: central-rwa-db
      cancel-in-progress: false
    defaults:
      run:
        working-directory: central-rwa/backend
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # para saber se a configuração mudou neste push
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: central-rwa/backend/pyproject.toml
      - run: pip install -e .
      - name: Migrations + eventos e agentes
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL não configurada — deploy pulado."
            exit 0
          fi
          python -m central_rwa migrate
          # Mudou config/ (cesta nova, ativo novo na lista de observação)? Então
          # os ativos novos ainda não têm histórico, e sem histórico o agente
          # nasce mudo. O backfill é retomável e pula quem já está completo.
          if ! git diff --quiet HEAD~1 HEAD -- config 2>/dev/null; then
            echo "configuração mudou: baixando o histórico dos ativos novos"
            python -m central_rwa backfill
          else
            python -m central_rwa agents
          fi
