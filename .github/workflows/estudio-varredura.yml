name: Laboratório de Agentes · varredura (15 min)

# Laboratório de Agentes (antigo Estúdio de Agentes de Pools). Fase 2: snapshot de 15 min (DexScreener) e
# velas de 1h (GeckoTerminal) das pools-alvo, gravados no schema estudio.
# Fase 3: depois da varredura, a rodada dos seis agentes e do supervisor,
# no máximo uma vez por hora (o próprio comando confere a última rodada).
# Registro: docs/estudio-agentes.md.
#
# QUEM DISPARA: o pg_cron do Supabase, a cada 15 min, por workflow_dispatch
# (migração 20261112000001_estudio_varredura.sql). O cron do próprio GitHub
# atrasa horas e não serve para este ritmo. Também dá para rodar pelo botão
# "Run workflow".
#
# CREDENCIAL: ESTUDIO_DB_URL, o papel estudio_agente (só o schema estudio).
# Sem o segredo, avisa e sai sem erro.
on:
  workflow_dispatch:

# Grupo próprio: não espera a coleta do Scanner (até 53 min).
concurrency:
  group: estudio-varredura
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  varredura:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: central-rwa/backend
    env:
      ESTUDIO_DB_URL: ${{ secrets.ESTUDIO_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: central-rwa/backend/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: pip install -e .
      - name: Varredura
        run: python -m central_rwa estudio
      # Roda mesmo se a varredura marcar erro: os agentes usam o que já está no banco.
      - name: Agentes
        if: ${{ !cancelled() }}
        run: python -m central_rwa agentes
