name: Scanner Pools · coleta (4h)

# Coleta pools de liquidez (DefiLlama, GeckoTerminal, Orca e Raydium), classifica em
# Sólidas/Pendentes de análise, dá nota e grava no Supabase.
# Regras vigentes: docs/superpowers/specs/2026-09-26-scanner-regras-design.md.
#
# QUEM DISPARA (desde 04/10/2026)
#   workflow_dispatch  o pg_cron do Supabase, às 00/04/08/12/16/20 h UTC
#                      (migração 20261004000001_scanner_agendamento.sql), ou o
#                      botão "Run workflow". Sempre coleta.
#   schedule           RESERVA de hora em hora: só coleta se a última coleta
#                      tiver mais de 4 h 20 min — ou seja, se o Supabase falhou.
#                      O cron do GitHub atrasa de 2 a 5 h; por isso não é ele
#                      quem marca o ritmo.
#   push               aplica as migrações na hora; também não coleta fora de hora.
on:
  push:
    branches: [main]
    paths: ['central-rwa/backend/central_rwa/pools/**', '.github/workflows/scanner-pools.yml',
            'central-rwa/supabase/migrations/*scanner*']
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:

# O scanner escreve no schema scanner; seu grupo não bloqueia jobs da Central RWA.
concurrency:
  group: scanner-pools-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pools:
    runs-on: ubuntu-latest
    # Medido em 02/10/2026: 35 a 53 min por coleta. Com 55 o corte vinha a 2 min
    # de distância — e coleta cortada não grava nada. 80 dá folga para 429.
    timeout-minutes: 80
    defaults:
      run:
        working-directory: central-rwa/backend
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: central-rwa/backend/pyproject.toml
      - run: pip install -e .
      - name: Migrations (idempotentes)
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then exit 0; fi
          python -m central_rwa migrate
      - name: Coletar pools
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL não configurada — coleta pulada (configure o segredo para ativar)."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m central_rwa pools
          else
            python -m central_rwa pools --pular-se-recente 260
          fi
