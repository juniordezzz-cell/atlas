[project]
name = "central-rwa"
version = "0.1.0"
description = "ATLAS · Scanner Pools — coleta de pools de liquidez"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "psycopg[binary]>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "respx>=0.23", "pgserver>=0.1"]  # pgserver: Postgres embutido p/ testes de integração

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["central_rwa*"]
