# Candidatos a cesta, por TEMA. O tema é o filtro para escolher os ativos;
# quem decide em qual cesta cada um cai é o RISCO, medido pelo ATR% (veja
# `python -m central_rwa lab risco` e docs/central-rwa/CESTAS.md).
#
# Todo ticker aqui foi conferido contra o catálogo de tokens do xStocks em
# 2026-09-20: os 132 têm token em pelo menos uma das 4 redes. Exceções
# declaradas de propósito:
#   GOLD e WTI — commodity de referência (Yahoo GC=F / CL=F). Há token de ouro
#     (GLD), não há de petróleo; o agente entra pelo ativo de referência.
#   DXY e VIX  — pedidos na conversa, mas NÃO existem tokenizados e o backend
#     não tem símbolo para eles. Ficam de fora até virarem fonte de verdade.
#
# Acrescentar candidato: coloque o ticker no tema e rode `lab risco` de novo.
# ATENÇÃO: tickers que o YAML confunde com outra coisa precisam de aspas —
# ON, NO, Y, N, ON/OFF viram booleano ("ON" é a ON Semiconductor).

